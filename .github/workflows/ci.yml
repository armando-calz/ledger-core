name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B verify

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: docker build --tag ledger-core:ci .

      - name: Smoke test with Docker Compose
        run: |
          docker compose up --build --detach --wait --wait-timeout 120 postgres
          docker compose up --detach app
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && exit 0; sleep 2; done
          docker compose logs app
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down --volumes
